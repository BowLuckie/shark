  <script>
    (function () {
      var BIG = 1000000000;
      function fix(o) {o.ADS_OFF = true; o.OFF_ADS_TIME = BIG; return o;}
      try {
        var a = localStorage.getItem("savesData");
        if (a) localStorage.setItem("savesData", JSON.stringify(fix(JSON.parse(a))));
        var b = localStorage.getItem("yg_saves");
        if (b) {
          var y = JSON.parse(b);
          y.saves = (y.saves || []).map(function (x) {return JSON.stringify(fix(JSON.parse(x)));});
          localStorage.setItem("yg_saves", JSON.stringify(y));
        }
      } catch (e) {console.warn("ads patch failed", e);}
    })();
  </script>

  <style>
    #load-log {
      position: fixed;

  </style>
  <script>
    (function () {
      var buf = [], box = null, MAX = 5000;
      function fmt(a) {
        return Array.prototype.map.call(a, function (x) {
          if (x instanceof Error) return x.message;
          if (typeof x === "object") {try {return JSON.stringify(x);} catch (e) {return String(x);} }
          return String(x);
        }).join(" ");
      }
      function add(level, text) {
        var line = {level: level, text: text}; if (text.indexOf("Game Ready") !== -1 && !window.__gameReady) window.__gameReady = Date.now();
        if (!box) {buf.push(line); if (buf.length > MAX) buf.shift(); return;}
        draw(line);
      }
      function stick() {
        if (!box) return;
        box.scrollTop = box.scrollHeight;
        requestAnimationFrame(function () {box.scrollTop = box.scrollHeight;});
      }
      function draw(line) {
        var d = document.createElement("div");
        d.className = line.level;
        d.textContent = line.text;
        box.appendChild(d);
        while (box.children.length > MAX) box.removeChild(box.firstChild);
        stick();
      }
      ["log", "info", "warn", "error", "debug", "trace", "dir", "table"].forEach(function (lv) {
        var orig = console[lv];
        console[lv] = function () {
          try {add((lv === "warn" || lv === "error") ? lv : "log", fmt(arguments));} catch (e) { }
          return orig.apply(console, arguments);
        };
      });
      window.addEventListener("error", function (e) {add("error", "ERR " + e.message);});
      window.addEventListener("unhandledrejection", function (e) {
        add("error", "REJECT " + (e.reason && e.reason.message || e.reason));
      });
      window.addEventListener("error", function (e) {
        var t = e.target;
        if (t && t !== window && (t.src || t.href)) add("error", "LOAD FAIL " + (t.src || t.href));
      }, true);
      var ofetch = window.fetch;
      if (ofetch) window.fetch = function (u) {
        var url = ((u && u.url) || String(u)).slice(0, 120);
        return ofetch.apply(this, arguments).then(function (r) {
          add(r.ok ? "log" : "error", "fetch " + r.status + " " + url);
          return r;
        }, function (e) {
          add("error", "fetch FAILED " + url);
          throw e;
        });
      };
      function mount() {
        var host = document.getElementById("loading-cover") || document.body;
        if (!host) return;
        box = document.createElement("div");
        box.id = "load-log";
        host.appendChild(box);
        if (window.ResizeObserver) new ResizeObserver(stick).observe(box);
        buf.forEach(draw);
        buf = [];
      }
      if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", mount);
      else mount();
    })();
  </script>

  <script>
    (function () {
      var LANG = window.GAME_CFG.LANG;
      function noop() { }
      function res(v) {return Promise.resolve(v);}

      function deep() {
        var f = function () {return res(deep());};
        return new Proxy(f, {
          get: function (t, p) {
            if (p === "then" || p === "catch" || p === "finally") return undefined;
            if (typeof p === "symbol") return undefined;
            return deep();
          },
          apply: function () {return res(undefined);}
        });
      }

      var store = {};
      var stats = {};
      try {store = JSON.parse(localStorage.getItem("yg_saves") || "{}") || {};} catch (e) {store = {};}
      try {stats = JSON.parse(localStorage.getItem("yg_stats") || "{}") || {};} catch (e) {stats = {};}
      function persist() {
        try {localStorage.setItem("yg_saves", JSON.stringify(store));} catch (e) { }
        try {localStorage.setItem("yg_stats", JSON.stringify(stats));} catch (e) { }
      }

      var playerObj = {
        getData: function (keys) {
          if (!keys || !keys.length) return res(store);
          var o = {};
          for (var i = 0; i < keys.length; i++) if (store[keys[i]] !== undefined) o[keys[i]] = store[keys[i]];
          return res(o);
        },
        setData: function (d) {for (var k in d) store[k] = d[k]; persist(); return res(true);},
        getStats: function () {return res(stats);},
        setStats: function (s) {for (var k in s) stats[k] = s[k]; persist(); return res(true);},
        incrementStats: function (s) {for (var k in s) stats[k] = (stats[k] || 0) + s[k]; persist(); return res(stats);},
        getName: function () {return "Player";},
        getPhoto: function () {return "unknown";},
        getUniqueID: function () {return "local-player";},
        getMode: function () {return "lite";},
        isAuthorized: function () {return false;},
        getPayingStatus: function () {return "unknown";},
        signature: "",
        scopePermissions: {avatar: "not_set", public_name: "not_set"}
      };

      var lbObj = {
        setLeaderboardScore: function () {return res(true);},
        getLeaderboardDescription: function (n) {
          return res({
            appID: "0", default: true, title: {en: n},
            description: {
              invert_sort_order: false,
              score_format: {options: {decimal_offset: 0}},
              type: "numeric"
            }
          });
        },
        getLeaderboardEntries: function () {return res({leaderboard: {}, ranges: [], userRank: 0, entries: []});},
        getLeaderboardPlayerEntry: function () {
          var e = new Error("no entry");
          e.code = "LEADERBOARD_PLAYER_NOT_PRESENT";
          return Promise.reject(e);
        }
      };

      var fullscreenState = {status: "off"};

      var base = {
        environment: {
          app: {id: "0"},
          browser: {lang: LANG},
          i18n: {lang: LANG, tld: "com"},
          payload: null
        },
        deviceInfo: {
          type: /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) ? "mobile" : "desktop",
          isMobile: function () {return /iPhone|iPod|Android/i.test(navigator.userAgent);},
          isDesktop: function () {return !/iPhone|iPad|iPod|Android/i.test(navigator.userAgent);},
          isTablet: function () {return /iPad/i.test(navigator.userAgent);},
          isTV: function () {return false;}
        },
        adv: {
          showFullscreenAdv: function (o) {
            var c = (o && o.callbacks) || {};
            setTimeout(function () {try {c.onClose && c.onClose(false);} catch (e) { } }, 0);
          },
          showRewardedVideo: function (o) {
            var c = (o && o.callbacks) || {};
            setTimeout(function () {
              try {c.onOpen && c.onOpen();} catch (e) { }
              try {c.onRewarded && c.onRewarded();} catch (e) { }
              try {c.onClose && c.onClose();} catch (e) { }
            }, 0);
          },
          showBannerAdv: function () {return res({stickyAdvIsShowing: false, reason: "adv_is_not_connected"});},
          hideBannerAdv: function () {return res({stickyAdvIsShowing: false});},
          getBannerAdvStatus: function () {return res({stickyAdvIsShowing: false, reason: "adv_is_not_connected"});}
        },
        features: {
          LoadingAPI: {ready: noop},
          GameplayAPI: {start: noop, stop: noop},
          GamesAPI: {getAllGames: function () {return res({games: [], developerURL: ""});}}
        },
        leaderboards: {
          setScore: function () {return res(true);},
          getDescription: lbObj.getLeaderboardDescription,
          getEntries: lbObj.getLeaderboardEntries,
          getPlayerEntry: lbObj.getLeaderboardPlayerEntry
        },
        getLeaderboards: function () {return res(lbObj);},
        getPlayer: function () {return res(playerObj);},
        getPayments: function () {return Promise.reject(new Error("payments unavailable"));},
        getStorage: function () {return res(window.localStorage);},
        getFlags: function () {return res({});},
        feedback: {
          canReview: function () {return res({value: false, reason: "NO_AUTH"});},
          requestReview: function () {return res({feedbackSent: false});}
        },
        shortcut: {
          canShowPrompt: function () {return res({canShow: false});},
          showPrompt: function () {return res({outcome: "dismissed"});}
        },
        screen: {
          fullscreen: {
            get status() {return fullscreenState.status;},
            request: function () {
              try {
                var el = document.documentElement;
                if (el.requestFullscreen) {
                  var r = el.requestFullscreen();
                  if (r && r.catch) r.catch(function () { });
                }
              } catch (e) { }
              fullscreenState.status = "on";
              return res(true);
            },
            exit: function () {
              try {if (document.exitFullscreen) {var r = document.exitFullscreen(); if (r && r.catch) r.catch(function () { });} } catch (e) { }
              fullscreenState.status = "off";
              return res(true);
            }
          }
        },
        auth: {openAuthDialog: function () {return Promise.reject(new Error("no auth"));}},
        isAvailableMethod: function () {return res(false);},
        dispatchEvent: function () {return res(true);},
        on: function () {return noop;},
        off: function () {return true;},
        EVENT_HISTORY_BACK: "HISTORY_BACK",
        EVENT_GAME_API_PAUSE: "game_api_pause",
        EVENT_GAME_API_RESUME: "game_api_resume"
      };

      document.addEventListener("fullscreenchange", function () {
        fullscreenState.status = document.fullscreenElement ? "on" : "off";
      });

      var proxied = new Proxy(base, {
        get: function (t, p) {
          if (p === "then" || p === "catch" || p === "finally") return undefined;
          if (p in t) return t[p];
          if (typeof p === "symbol") return undefined;
          return deep();
        }
      });

      window.YaGames = {init: function () {return res(proxied);}};
    })();
  </script>

  <script>
    window.hideFullScreenButton = "";
    window.myGameInstance = null;
    window.ysdk = null;
    window.player = null;
    window.payments = null;
    window.leaderboard = null;
    window.initGame = false;
    window.nowFullAdOpen = false;
    window.cloudSaves = "noData";
    window.paymentsData = "none";
    window.environmentData = "null";
    window.playerData = "noData";

    (function () {
      var C = window.GAME_CFG;
      var F = window.GAME_FILES;
      var B = window.GAME_B;

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingCover = document.querySelector("#loading-cover");
      var progressBarEmpty = document.querySelector("#unity-progress-bar-empty");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var spinner = document.querySelector(".spinner");

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) container.className = "unity-mobile";
      loadingCover.style.background = "#282828";
      loadingCover.style.display = "";

      document.addEventListener("contextmenu", function (e) {e.preventDefault();});

      window.FocusGame = function () {
        try {window.focus(); canvas.focus();} catch (e) { }
      };
      window.addEventListener("pointerdown", function () {window.FocusGame();});
      window.addEventListener("touchstart", function () {window.FocusGame();});

      document.addEventListener("visibilitychange", function () {
        if (window.ysdk !== null && window.initGame === true && window.myGameInstance) {
          if (document.hidden) {
            window.myGameInstance.SendMessage("YandexGame", "OnVisibilityGameWindow", "false");
          } else {
            window.myGameInstance.SendMessage("YandexGame", "OnVisibilityGameWindow", "true");
            try {
              if ((window.ysdk.deviceInfo.isMobile() || window.ysdk.deviceInfo.isTablet()) &&
                window.ysdk.screen.fullscreen.status === "off") {
                window.ysdk.screen.fullscreen.request();
              }
            } catch (e) { }
          }
        }
      });

      window.ResumeGame = function () {
        if (window.myGameInstance && window.myGameInstance.Module) {
          try {window.myGameInstance.Module.resumeMainLoop();} catch (e) { }
        }
        var els = document.querySelectorAll("audio, video");
        for (var i = 0; i < els.length; i++) els[i].muted = false;
      };

      try {
        var rpl = Element.prototype.requestPointerLock;
        Element.prototype.requestPointerLock = function () {
          try {var r = rpl.apply(this, arguments); if (r && r.catch) r.catch(function () { }); return r;} catch (e) { }
        };
        var rfs = Element.prototype.requestFullscreen;
        if (rfs) {
          Element.prototype.requestFullscreen = function () {
            try {var r = rfs.apply(this, arguments); if (r && r.catch) r.catch(function () { }); return r;}
            catch (e) {return Promise.resolve();}
          };
        }
      } catch (e) { }

      window.addEventListener("error", function (ev) {
        var m = ev && ev.message ? String(ev.message) : "";
        if (m.indexOf("pointer lock") !== -1 || m.indexOf("Fullscreen") !== -1) ev.preventDefault();
      }, true);

      function Gunzip(bytes) {
        if (!(bytes.length > 2 && bytes[0] === 0x1f && bytes[1] === 0x8b)) return Promise.resolve(bytes);
        if (typeof DecompressionStream === "undefined") return Promise.resolve(bytes);
        try {
          var stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
          return new Response(stream).arrayBuffer().then(function (buf) {
            var out = new Uint8Array(buf);
            return out.length ? out : bytes;
          }).catch(function () {return bytes;});
        } catch (e) {return Promise.resolve(bytes);}
      }

      function FetchBytes(url) {
        return fetch(url, {cache: "force-cache"}).then(function (r) {
          if (!r.ok) throw new Error(url + " -> " + r.status);
          return r.arrayBuffer();
        }).then(function (b) {return new Uint8Array(b);});
      }

      function ToBlobUrl(u8) {
        return URL.createObjectURL(new Blob([u8], {type: "application/octet-stream"}));
      }

      function FetchSingle(name) {
        return FetchBytes(B(name)).then(Gunzip).then(ToBlobUrl);
      }

      function FetchParts(name, count) {
        var jobs = [];
        for (var i = 0; i < count; i++) jobs.push(FetchBytes(B(name + ".part" + i)));
        return Promise.all(jobs).then(function (chunks) {
          var total = 0, i;
          for (i = 0; i < chunks.length; i++) total += chunks[i].length;
          var merged = new Uint8Array(total), off = 0;
          for (i = 0; i < chunks.length; i++) {merged.set(chunks[i], off); off += chunks[i].length;}
          return Gunzip(merged);
        }).then(ToBlobUrl);
      }

      var config = null;
      var loaderReady = false;
      var filesReady = false;
      var started = false;

      window.StartUnityInstance = function () {
        if (started || !loaderReady || !filesReady || !config) return;
        if (typeof createUnityInstance !== "function") return;
        started = true;
        createUnityInstance(canvas, config, function (progress) {
          spinner.style.display = "none";
          progressBarEmpty.style.display = "";
          progressBarFull.style.width = (100 * progress) + "%"; var pc = document.getElementById("load-pct"); if (pc) pc.textContent = Math.round(100 * progress) + "%";
        }).then(function (unityInstance) {
          window.myGameInstance = unityInstance;
          (function () {var t0 = Date.now(); (function chk() {if ((window.__gameReady && Date.now() - window.__gameReady > 1500) || Date.now() - t0 > 20000) {loadingCover.style.background = ""; loadingCover.style.display = "none";} else setTimeout(chk, 250);})();})();
          window.FocusGame();
        }).catch(function (message) {
          console.error(message);
        });
      };
      window.StartUnityInstance_IfUnloaded = window.StartUnityInstance;

      window.InitGame = function () {
        window.initGame = true;
        if (window.nowFullAdOpen === true && window.myGameInstance != null) {
          window.myGameInstance.SendMessage("YandexGame", "OpenFullAd");
        }
      };

      window.FullAdShow = function () {
        try {
          if (window.nowFullAdOpen !== true && window.ysdk !== null) {
            window.ysdk.adv.showFullscreenAdv({
              callbacks: {
                onOpen: function () {
                  window.nowFullAdOpen = true;
                  if (window.initGame === true) window.myGameInstance.SendMessage("YandexGame", "OpenFullAd");
                },
                onClose: function (wasShown) {
                  window.nowFullAdOpen = false;
                  if (window.initGame === true) {
                    window.myGameInstance.SendMessage("YandexGame", "CloseFullAd", wasShown ? "true" : "false");
                  }
                  window.FocusGame();
                },
                onError: function () {
                  window.nowFullAdOpen = false;
                  if (window.initGame === true) window.myGameInstance.SendMessage("YandexGame", "ErrorFullAd");
                  window.FocusGame();
                }
              }
            });
          }
        } catch (e) { }
      };

      window.RewardedShow = function (id) {
        try {
          window.ysdk.adv.showRewardedVideo({
            callbacks: {
              onOpen: function () {window.myGameInstance.SendMessage("YandexGame", "OpenVideo");},
              onClose: function () {window.myGameInstance.SendMessage("YandexGame", "CloseVideo"); window.FocusGame();},
              onRewarded: function () {window.myGameInstance.SendMessage("YandexGame", "RewardVideo", id);},
              onError: function () {window.myGameInstance.SendMessage("YandexGame", "ErrorVideo");}
            }
          });
        } catch (e) { }
      };

      window.StickyAdActivity = function (show) {
        try {
          window.ysdk.adv.getBannerAdvStatus().then(function (s) {
            if (s.stickyAdvIsShowing) {if (!show) window.ysdk.adv.hideBannerAdv();}
            else if (show) window.ysdk.adv.showBannerAdv();
          });
        } catch (e) { }
      };

      window.Review = function () {
        try {
          window.ysdk.feedback.canReview().then(function (a) {
            if (a.value) {
              window.ysdk.feedback.requestReview().then(function (x) {
                window.myGameInstance.SendMessage("YandexGame", "ReviewSent", x.feedbackSent ? "true" : "false");
                window.FocusGame();
              });
            } else window.FocusGame();
          });
        } catch (e) {window.FocusGame();}
      };

      window.PromptShow = function () {
        try {
          window.ysdk.shortcut.showPrompt().then(function (r) {
            window.myGameInstance.SendMessage("YandexGame", r.outcome === "accepted" ? "OnPromptSuccess" : "OnPromptFail");
            window.FocusGame();
          });
        } catch (e) {window.FocusGame();}
      };

      window.SaveCloud = function (jsonData, flush) {
        if (window.player == null) return;
        try {window.player.setData({saves: [jsonData]}, flush);} catch (e) { }
      };

      window.LoadCloud = function (sendback) {
        return new Promise(function (resolve) {
          function fail() {
            if (sendback && window.myGameInstance) window.myGameInstance.SendMessage("YandexGame", "SetLoadSaves", "noData");
            resolve("noData");
          }
          if (window.ysdk == null) return fail();
          try {
            window.ysdk.getPlayer({scopes: false}).then(function (p) {
              p.getData(["saves"]).then(function (data) {
                if (data && data.saves) {
                  var s = JSON.stringify(data.saves);
                  if (sendback && window.myGameInstance) window.myGameInstance.SendMessage("YandexGame", "SetLoadSaves", s);
                  resolve(s);
                } else fail();
              }).catch(fail);
            }).catch(fail);
          } catch (e) {fail();}
        });
      };

      window.GetPayments = function (sendback) {
        return new Promise(function (resolve) {
          try {
            if (window.ysdk == null) return resolve("none");
            window.ysdk.getPayments().then(function (p) {
              window.payments = p;
              p.getCatalog().then(function (products) {
                p.getPurchases().then(function (purchases) {
                  var productID = [], title = [], description = [], imageURI = [], price = [];
                  var priceValue = [], priceCurrencyCode = [], currencyImageURL = [], consumed = [];
                  for (var i = 0; i < products.length; i++) {
                    productID[i] = products[i].id;
                    title[i] = products[i].title;
                    description[i] = products[i].description;
                    imageURI[i] = products[i].imageURI;
                    price[i] = products[i].price;
                    priceValue[i] = products[i].priceValue;
                    priceCurrencyCode[i] = products[i].priceCurrencyCode;
                    currencyImageURL[i] = products[i].getPriceCurrencyImage("medium");
                    consumed[i] = true;
                    for (var j = 0; j < purchases.length; j++) {
                      if (purchases[j].productID === productID[i]) {consumed[i] = false; break;}
                    }
                  }
                  var s = JSON.stringify({
                    id: productID, title: title, description: description, imageURI: imageURI,
                    price: price, priceValue: priceValue, priceCurrencyCode: priceCurrencyCode,
                    currencyImageURL: currencyImageURL, consumed: consumed,
                    language: window.ysdk.environment.i18n.lang
                  });
                  if (sendback && window.myGameInstance) window.myGameInstance.SendMessage("YandexGame", "PaymentsEntries", s);
                  resolve(s);
                }).catch(function () {resolve("none");});
              }).catch(function () {resolve("none");});
            }).catch(function () {resolve("none");});
          } catch (e) {resolve("none");}
        });
      };

      window.BuyPayments = function (id) {
        try {
          if (window.payments != null) {
            window.payments.purchase(id).then(function () {
              window.ConsumePurchase(id);
              window.FocusGame();
            }).catch(function () {
              window.myGameInstance.SendMessage("YandexGame", "OnPurchaseFailed", id);
              window.FocusGame();
            });
          } else {
            window.myGameInstance.SendMessage("YandexGame", "OnPurchaseFailed", id);
          }
        } catch (e) {window.FocusGame();}
      };

      window.ConsumePurchase = function (id) {
        try {
          if (window.payments == null) return;
          window.payments.getPurchases().then(function (purchases) {
            for (var i = 0; i < purchases.length; i++) {
              if (purchases[i].productID === id) {
                window.payments.consumePurchase(purchases[i].purchaseToken);
                window.myGameInstance.SendMessage("YandexGame", "OnPurchaseSuccess", id);
              }
            }
          });
        } catch (e) { }
      };

      window.ConsumePurchases = function () {
        try {
          if (window.payments == null) return;
          window.payments.getPurchases().then(function (purchases) {
            for (var i = 0; i < purchases.length; i++) {
              window.payments.consumePurchase(purchases[i].purchaseToken);
              window.myGameInstance.SendMessage("YandexGame", "OnPurchaseSuccess", purchases[i].productID);
            }
          });
        } catch (e) { }
      };

      window.InitLeaderboards = function () {
        if (window.ysdk == null) return;
        try {
          window.ysdk.getLeaderboards().then(function (lb) {window.leaderboard = lb;});
        } catch (e) { }
      };

      window.WaitForLeaderboard = function () {
        return new Promise(function (resolve, reject) {
          var timeout;
          var interval = setInterval(function () {
            if (window.leaderboard !== null) {
              clearInterval(interval);
              clearTimeout(timeout);
              resolve();
            }
          }, 100);
          timeout = setTimeout(function () {
            clearInterval(interval);
            reject(new Error("Leaderboard initialization timeout"));
          }, 5000);
        });
      };

      window.GetLeaderboardScores = function (nameLB, maxPlayers, quantityTop, quantityAround, photoSize, auth) {
        function run() {
          var jsonEntries = {technoName: "", isDefault: false, isInvertSortOrder: false, decimalOffset: 0, type: ""};
          window.ysdk.getLeaderboards()
            .then(function (lb) {
              return lb.getLeaderboardDescription(nameLB).then(function (r) {
                jsonEntries.technoName = nameLB;
                jsonEntries.isDefault = r.default;
                jsonEntries.isInvertSortOrder = r.description.invert_sort_order;
                jsonEntries.decimalOffset = r.description.score_format.options.decimal_offset;
                jsonEntries.type = r.description.type;
                return lb.getLeaderboardEntries(nameLB, {
                  quantityTop: quantityTop, includeUser: auth, quantityAround: quantityAround
                });
              });
            })
            .then(function (r) {
              var jsonPlayers = window.EntriesLB(r, maxPlayers, photoSize);
              var combined = {}, k;
              for (k in jsonEntries) combined[k] = jsonEntries[k];
              for (k in jsonPlayers) combined[k] = jsonPlayers[k];
              window.myGameInstance.SendMessage("YandexGame", "LeaderboardEntries", JSON.stringify(combined));
            })
            .catch(function () { });
        }
        if (window.ysdk == null) return;
        if (window.leaderboard === null) window.WaitForLeaderboard().then(run).catch(function () {run();});
        else run();
      };

      window.SetLeaderboardScores = function (_name, score) {
        function run() {
          try {
            window.ysdk.getLeaderboards().then(function (lb) {lb.setLeaderboardScore(_name, score);});
          } catch (e) { }
        }
        if (window.ysdk == null) return;
        if (window.leaderboard === null) window.WaitForLeaderboard().then(run).catch(function () {run();});
        else run();
      };

      window.EntriesLB = function (r, maxPlayers, photoSize) {
        var text = "";
        var count = r.entries.length < maxPlayers ? r.entries.length : maxPlayers;
        var ranks = new Array(count), photos = new Array(count), names = new Array(count);
        var scores = new Array(count), uniqueIDs = new Array(count);

        for (var i = 0; i < count; i++) {
          ranks[i] = r.entries[i].rank;
          scores[i] = r.entries[i].score;
          uniqueIDs[i] = r.entries[i].player.uniqueID;
          photos[i] = r.entries[i].player.getAvatarSrc(photoSize);

          if (r.entries[i].player.scopePermissions.public_name !== "allow") names[i] = "anonymous";
          else names[i] = r.entries[i].player.publicName;

          text += ranks[i] + ". " + names[i] + ": " + scores[i] + "\n";
        }
        if (count === 0) text = "no data";

        return {entries: text, ranks: ranks, photos: photos, names: names, scores: scores, uniqueIDs: uniqueIDs};
      };

      window.RequestingEnvironmentData = function (sendback) {
        return new Promise(function (resolve) {
          if (window.ysdk == null) return resolve("null");
          try {
            window.ysdk.feedback.canReview().then(function (a) {
              var reviewCanShow = !!a.value;
              window.ysdk.shortcut.canShowPrompt().then(function (prompt) {
                var promptCanShow = !!(prompt && prompt.canShow);
                var ua = navigator.userAgent, browser;
                if (ua.indexOf("YaBrowser") !== -1 || ua.indexOf("YaSearchBrowser") !== -1) browser = "Yandex";
                else if (ua.indexOf("Opera") !== -1 || ua.indexOf("OPR") !== -1) browser = "Opera";
                else if (ua.indexOf("Firefox") !== -1) browser = "Firefox";
                else if (ua.indexOf("MSIE") !== -1) browser = "IE";
                else if (ua.indexOf("Edge") !== -1) browser = "Edge";
                else if (ua.indexOf("Chrome") !== -1) browser = "Chrome";
                else if (ua.indexOf("Safari") !== -1) browser = "Safari";
                else browser = "Other";

                var s = JSON.stringify({
                  language: window.ysdk.environment.i18n.lang,
                  domain: window.ysdk.environment.i18n.tld,
                  deviceType: window.ysdk.deviceInfo.type,
                  isMobile: window.ysdk.deviceInfo.isMobile(),
                  isDesktop: window.ysdk.deviceInfo.isDesktop(),
                  isTablet: window.ysdk.deviceInfo.isTablet(),
                  isTV: window.ysdk.deviceInfo.isTV(),
                  appID: window.ysdk.environment.app.id,
                  browserLang: window.ysdk.environment.browser.lang,
                  payload: window.ysdk.environment.payload,
                  promptCanShow: promptCanShow,
                  reviewCanShow: reviewCanShow,
                  platform: navigator.platform,
                  browser: browser
                });
                if (sendback && window.myGameInstance) window.myGameInstance.SendMessage("YandexGame", "SetEnvirData", s);
                resolve(s);
              });
            });
          } catch (e) {resolve("null");}
        });
      };

      window.NotAuthorized = function () {
        var paying = "unknown";
        try {if (window.player) paying = window.player.getPayingStatus();} catch (e) { }
        return JSON.stringify({
          playerAuth: "rejected",
          playerName: "unauthorized",
          playerId: "unauthorized",
          playerPhoto: "unknown",
          payingStatus: paying
        });
      };

      window.InitPlayer = function (sendback) {
        return new Promise(function (resolve) {
          function fail() {
            var s = window.NotAuthorized();
            if (sendback && window.myGameInstance) {
              window.myGameInstance.SendMessage("YandexGame", "SetInitializationSDK", s);
            }
            resolve(s);
          }
          try {
            if (window.ysdk == null) return fail();
            window.ysdk.getPlayer({scopes: true}).then(function (p) {
              window.player = p;
              if (p.getMode() === "lite") return fail();
              var s = JSON.stringify({
                playerAuth: "resolved",
                playerName: p.getName(),
                playerId: p.getUniqueID(),
                playerPhoto: p.getPhoto("small"),
                payingStatus: p.getPayingStatus()
              });
              if (sendback && window.myGameInstance) {
                window.myGameInstance.SendMessage("YandexGame", "SetInitializationSDK", s);
              }
              resolve(s);
            }).catch(fail);
          } catch (e) {fail();}
        });
      };

      window.OpenAuthDialog = function () {
        if (window.ysdk == null) return;
        try {
          window.ysdk.auth.openAuthDialog().then(function () {
            window.InitPlayer(true).then(function () {
              window.myGameInstance.SendMessage("YandexGame", "GetDataInvoke");
            });
          }).catch(function () { });
        } catch (e) { }
      };

      window.InitYSDK = function () {
        return window.YaGames.init().then(function (sdk) {
          window.ysdk = sdk;
          window.FullAdShow();
          return window.LoadCloud();
        }).then(function (v) {
          window.cloudSaves = v;
          return window.GetPayments();
        }).then(function (v) {
          window.paymentsData = v;
          window.InitLeaderboards();
          return window.RequestingEnvironmentData();
        }).then(function (v) {
          window.environmentData = v;
          return window.InitPlayer();
        }).then(function (v) {
          window.playerData = v;
        }).catch(function (e) {
          console.error("CRASH Initialization SDK: ", e);
        }).then(function () {
          window.StartUnityInstance();
        });
      };

      Promise.all([
        FetchSingle(C.FRAMEWORK),
        FetchParts(C.WASM, C.WASM_PARTS),
        FetchParts(C.DATA, C.DATA_PARTS)
      ]).then(function (u) {
        config = {
          dataUrl: u[2],
          frameworkUrl: u[0],
          codeUrl: u[1],
          streamingAssetsUrl: F.STREAMING,
          companyName: "DefaultCompany",
          productName: "Shrek Scool Escape",
          productVersion: "1.0.2"
        };
        filesReady = true;
        window.StartUnityInstance();
      }).catch(function (e) {
        console.error("asset load failed", e);
      });

      var script = document.createElement("script");
      script.src = B(C.LOADER);
      script.onload = function () {
        loaderReady = true;
        window.InitYSDK();
      };
      script.onerror = function () {console.error("loader failed");};
      document.body.appendChild(script);
    })();
  </script>

  <style>
    /* Container: Bottom center, fixed, with overflow hidden */
    #ad-container {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: min(728px, calc(100% - 20px));
      /* 728px, 10px margin on mobile */
      height: 90px;
      background: rgba(0, 0, 0, 0.90);
      display: none;
      z-index: 99999;
      border-radius: 0;
      /* Sharp corners */
      overflow: hidden;
      box-shadow: 0 -2px 12px rgba(0, 0, 0, 0.45);
      box-sizing: border-box;
      transition: transform 0.5s ease-in-out;
      /* Smooth slide-in/out animation */
    }

    /* Slide-out animation */
    #ad-container.hidden {
      transform: translate(-50%, 100%);
      /* Slide down out of view */
    }

    #ad-iframe {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 745px;
      /* Updated width */
      height: 90px;
      /* Updated height */
      border: 0;
      display: block;
      overflow: hidden;
      pointer-events: auto;
      box-sizing: content-box;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    #ad-iframe::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }

    /* Close button with arrow */
    #close-ad {
      position: absolute;
      top: 6px;
      right: 8px;
      background: #ff4d4d;
      color: #fff;
      border: none;
      padding: 5px 9px;

      cursor: not-allowed;

      z-index: 100000;
      display: flex;
      align-items: center;
    }

    #close-ad.enabled {
      cursor: pointer;
      opacity: 1;
    }

    #close-ad::before {
      content: '↓';
      /* Down arrow for bottom ad */
      margin-right: 4px;
    }

    /* Right mask for scrollbar */
    #ad-right-mask {
      position: absolute;
      top: 0;
      right: 0;
      width: 12px;
      height: 100%;
      pointer-events: none;
      background: linear-gradient(to right, rgba(0, 0, 0, 0), rgba(0, 0, 0, 0.9));
      z-index: 99999;

    /* Mobile adjustments */
    @media (max-width: 440px) {
      #ad-container {
        width: calc(100% - 12px);
        left: 50%;
        transform: translateX(-50%);
        border-radius: 0;
        /* Sharp corners on mobile */

        width: 728px;
      }
    }

  <script>
    (function () {
      const showDelay = 2000; // 2 seconds delay before first show
      const countdownStart = 12; // 12 seconds countdown
      const reappearDelay = 150000; // 25 seconds before reappearance
      const adContainer = document.getElementById('ad-container');
      const closeBtn = document.getElementById('close-ad');

      function showAd() {
        // Show ad with smooth slide-in
        adContainer.style.display = 'block';
        adContainer.classList.remove('hidden');
        adContainer.setAttribute('aria-hidden', 'false');

        // Start countdown
        let timeLeft = countdownStart;
        closeBtn.textContent = `Close (${timeLeft})`;
        closeBtn.disabled = true;
        closeBtn.classList.remove('enabled');

        const t = setInterval(() => {
          timeLeft--;
          if (timeLeft > 0) {
            closeBtn.textContent = `Close (${timeLeft})`;
          } else {
            clearInterval(t);
            closeBtn.disabled = false;
            closeBtn.classList.add('enabled');
            closeBtn.textContent = 'Close ↓';
          }
        }, 1000);
      }

      // Initial ad show
      // ad popup disabled

      // Close with animation and schedule reappearance
      closeBtn.addEventListener('click', () => {
        if (closeBtn.disabled) return;
        adContainer.classList.add('hidden');
        adContainer.setAttribute('aria-hidden', 'true');
        // Schedule reappearance without removing or reloading iframe
        setTimeout(showAd, reappearDelay);
      });
    })();
  </script>
  <script>
    (function () {
      function lock() {
        if (navigator.keyboard && navigator.keyboard.lock && document.fullscreenElement) {
          // no args = lock every key
          navigator.keyboard.lock().catch(function (e) {console.warn("keyboard lock failed", e);});
        }
      }
      function unlock() {
        if (navigator.keyboard && navigator.keyboard.unlock) navigator.keyboard.unlock();
      }
      document.addEventListener("fullscreenchange", function () {
        document.fullscreenElement ? lock() : unlock();
      });

      // safety net: if a close shortcut still gets through, ask first
      window.addEventListener("beforeunload", function (e) {
        e.preventDefault();
        e.returnValue = "";
      });
    })();
  </script>
