<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shrek Neighbor</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      --bg: #282828;
      --fg: #ebdbb2;
      --mut: #a89984;
      --pan: #3c3836;
      --y: #fabd2f;
      --o: #fe8019;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      background: var(--bg);
      color: var(--fg);
      font: 14px/1.5 monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
    }

    h1 {
      color: var(--y);
      font-size: 2rem;
      font-weight: normal;
      letter-spacing: .1em;
      margin: 0;
    }

    nav {
      display: flex;
      flex-direction: column;
      gap: .75rem;
      width: min(90vw, 320px);
    }

    a.btn {
      display: block;
      text-align: center;
      text-decoration: none;
      color: var(--fg);
      background: var(--pan);
      border: 1px solid var(--mut);
      border-radius: 4px;
      padding: .8em 1em;
      font-size: 1.1rem;
    }

    a.btn:hover,
    a.btn:focus {
      border-color: var(--o);
      color: var(--o);
      outline: none;
    }

    a.btn kbd {
      color: var(--mut);
      margin-right: .6em;
    }

    #info {
      color: var(--mut);
      min-height: 1.5em;
    }
  </style>
</head>

<body>
  <h1>Shrek Neighbor</h1>
  <nav>
    <a class="btn" href="game.html" id="play"><kbd>1</kbd>Play</a>
    <a class="btn" href="saves.html" id="saves"><kbd>2</kbd>Save manager</a>
  </nav>
  <div id="info"></div>
  <script>
    (function () {
      // show current save status
      try {
        var s = JSON.parse(localStorage.getItem("savesData"));
        document.getElementById("info").textContent =
          s ? "Save found (id " + s.idSave + ")" : "No save yet, a new one starts on first play";
      } catch (e) {
        document.getElementById("info").textContent = "Save unreadable";
      }
      // keyboard shortcuts
      document.addEventListener("keydown", function (e) {
        if (e.ctrlKey || e.metaKey || e.altKey) return;
        if (e.key === "1" || e.key === "Enter") location.href = "game.html";
        if (e.key === "2") location.href = "saves.html";
      });
      document.getElementById("play").focus();
    })();
  </script>
</body>

</html>
