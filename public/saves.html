<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Save manager</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      --bg: #282828;
      --fg: #ebdbb2;
      --mut: #a89984;
      --pan: #3c3836;
      --y: #fabd2f;
      --o: #fe8019;
      --r: #fb4934;
      --g: #b8bb26;
    }

    body {
      background: var(--bg);
      color: var(--fg);
      font: 14px/1.5 monospace;
      max-width: 900px;
      margin: 0 auto;
      padding: 1rem;
    }

    h1 {
      color: var(--y);
      font-weight: normal;
      letter-spacing: .1em;
    }

    h2 {
      color: var(--o);
      font-weight: normal;
      margin-top: 1.5rem;
    }

    section {
      background: var(--pan);
      padding: .5rem 1rem 1rem;
      border-radius: 4px;
    }

    button,
    input[type=text] {
      background: var(--bg);
      color: var(--fg);
      border: 1px solid var(--mut);
      border-radius: 3px;
      padding: .3em .7em;
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:hover {
      border-color: var(--o);
    }

    textarea {
      width: 100%;
      height: 50vh;
      box-sizing: border-box;
      background: #1d2021;
      color: var(--fg);
      border: 1px solid var(--mut);
      font: 13px/1.4 monospace;
    }

    .row {
      display: flex;
      gap: .5rem;
      align-items: center;
      padding: .25rem 0;
      flex-wrap: wrap;
    }

    .name {
      flex: 1;
      min-width: 8em;
    }

    #msg {
      min-height: 1.5em;
      margin: .5rem 0;
    }

    .warn {
      color: var(--y);
    }

    a {
      color: var(--o);
    }
  </style>
</head>

<body>
  <h1>Save manager</h1>
  <p><a href="./">&larr; Back to game</a></p>
  <p class="warn">Close any other open game tabs first, or the game may overwrite your changes.</p>
  <div id="msg"></div>

  <h2>Slots</h2>
  <section>
    <div id="slots"></div>
    <div class="row">
      <input type="text" id="slotname" placeholder="slot name">
      <button id="saveslot">Save current as slot</button>
      <button id="importbtn">Import file as slot</button>
      <input type="file" id="importfile" accept=".txt,.json" hidden>
    </div>
  </section>

  <h2>Current save</h2>
  <section>
    <div class="row">
      <button id="export">Export current</button>
      <button id="apply">Apply edits</button>
      <button id="reload">Reload from storage</button>
    </div>
    <textarea id="ed" spellcheck="false"></textarea>
  </section>

  <script>
    (function () {
      var P = "mod_slot:";
      var $ = function (id) {return document.getElementById(id);};

      function msg(t, bad) {
        var m = $("msg");
        m.textContent = t;
        m.style.color = bad ? "var(--r)" : "var(--g)";
      }
      function parse(s) {try {var o = JSON.parse(s); return (o && typeof o === "object") ? o : null;} catch (e) {return null;} }
      function readCurrent() {return parse(localStorage.getItem("savesData"));}
      function slotNames() {
        return Object.keys(localStorage).filter(function (k) {return k.indexOf(P) === 0;})
          .map(function (k) {return k.slice(P.length);}).sort();
      }
      function idOf(s) {var o = parse(s); return o && o.idSave !== undefined ? o.idSave : "?";}

      // writes both copies and bumps idSave so the game prefers this one
      function writeSave(o) {
        var cur = readCurrent();
        o.idSave = Math.max(+o.idSave || 0, cur ? (+cur.idSave || 0) : 0) + 1;
        var s = JSON.stringify(o);
        localStorage.setItem("savesData", s);
        localStorage.setItem("yg_saves", JSON.stringify({saves: [s]}));
      }

      function download(name, saveString) {
        var dump = {savesData: saveString, yg_saves: JSON.stringify({saves: [saveString]})};
        var a = document.createElement("a");
        a.href = URL.createObjectURL(new Blob([JSON.stringify(dump)], {type: "text/plain"}));
        a.download = name + ".txt";
        a.click();
        setTimeout(function () {URL.revokeObjectURL(a.href);}, 5000);
      }

      function btn(label, fn) {
        var b = document.createElement("button");
        b.textContent = label;
        b.onclick = fn;
        return b;
      }

      function render() {
        var box = $("slots");
        box.textContent = "";
        var names = slotNames();
        if (!names.length) box.textContent = "No slots yet.";
        names.forEach(function (n) {
          var r = document.createElement("div");
          r.className = "row";
          var l = document.createElement("span");
          l.className = "name";
          l.textContent = n + "  (id " + idOf(localStorage.getItem(P + n)) + ")";
          r.append(l,
            btn("Use", function () {
              var o = parse(localStorage.getItem(P + n));
              if (!o) return msg("Slot is corrupt", true);
              writeSave(o); render(); msg("Now using \"" + n + "\"");
            }),
            btn("Export", function () {download(n, localStorage.getItem(P + n));}),
            btn("Delete", function () {
              if (confirm("Delete slot \"" + n + "\"?")) {localStorage.removeItem(P + n); render();}
            }));
          box.append(r);
        });
        var c = readCurrent();
        $("ed").value = c ? JSON.stringify(c, null, 2) : "";
      }

      $("saveslot").onclick = function () {
        var n = $("slotname").value.trim();
        var cur = localStorage.getItem("savesData");
        if (!n) return msg("Enter a slot name", true);
        if (!cur) return msg("No current save to store", true);
        localStorage.setItem(P + n, cur);
        $("slotname").value = "";
        render(); msg("Saved slot \"" + n + "\"");
      };

      $("importbtn").onclick = function () {$("importfile").click();};
      $("importfile").onchange = function () {
        var f = this.files[0], inp = this;
        if (!f) return;
        f.text().then(function (t) {
          var d = parse(t), o = null;
          if (d && typeof d.savesData === "string") o = parse(d.savesData);   // flat localStorage dump
          else if (d && d.idSave !== undefined) o = d;                        // bare save object
          if (!o) return msg("Not a recognised save file", true);
          var n = f.name.replace(/\.[^.]*$/, "");
          localStorage.setItem(P + n, JSON.stringify(o));
          render(); msg("Imported as slot \"" + n + "\" (use it with the Use button)");
        }).finally(function () {inp.value = "";});
      };

      $("export").onclick = function () {
        var cur = localStorage.getItem("savesData");
        if (!cur) return msg("No current save", true);
        download("game-save-" + new Date().toISOString().slice(0, 10), cur);
      };
      $("apply").onclick = function () {
        var o = parse($("ed").value);
        if (!o) return msg("Invalid JSON, nothing written", true);
        writeSave(o); render(); msg("Applied. idSave is now " + readCurrent().idSave);
      };
      $("reload").onclick = function () {render(); msg("Reloaded");};

      render();
    })();
  </script>
</body>

</html>
